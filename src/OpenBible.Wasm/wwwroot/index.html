<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1e3a5f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OpenBible" />
    <title>OpenBible</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/tailwind.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="OpenBible.Wasm.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <script>
        (function () {
            var theme = localStorage.getItem("ob-theme");
            if (theme === "light" || theme === "dark") {
                document.documentElement.dataset.theme = theme;
            }
        })();
    </script>
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        window.openBibleTheme = {
            get: function () {
                return localStorage.getItem("ob-theme") || "system";
            },
            set: function (value) {
                if (!value || value === "system") {
                    localStorage.removeItem("ob-theme");
                    delete document.documentElement.dataset.theme;
                    return;
                }

                localStorage.setItem("ob-theme", value);
                document.documentElement.dataset.theme = value;
            }
        };
        window.openBibleDisplay = (function () {
            var defaults = { size: 1.05, line: 1.7, font: "serif", numbers: true };
            var fonts = {
                serif: "Georgia, 'Times New Roman', serif",
                sans: "system-ui, -apple-system, 'Segoe UI', sans-serif"
            };
            function load() {
                try {
                    return Object.assign({}, defaults, JSON.parse(localStorage.getItem("ob-display") || "{}"));
                } catch (e) {
                    return Object.assign({}, defaults);
                }
            }
            function apply(s) {
                var root = document.documentElement.style;
                root.setProperty("--ob-verse-size", s.size + "rem");
                root.setProperty("--ob-verse-line", String(s.line));
                root.setProperty("--ob-verse-font", fonts[s.font] || fonts.serif);
                root.setProperty("--ob-verse-num-display", s.numbers ? "inline" : "none");
            }
            apply(load());
            return {
                get: function () { return JSON.stringify(load()); },
                set: function (json) {
                    var s = Object.assign({}, defaults, JSON.parse(json));
                    localStorage.setItem("ob-display", JSON.stringify(s));
                    apply(s);
                },
                reset: function () {
                    localStorage.removeItem("ob-display");
                    apply(defaults);
                }
            };
        })();
        window.openBibleShare = async function (text) {
            if (navigator.share) {
                try {
                    await navigator.share({ text: text });
                    return true;
                } catch (e) {
                    if (e && e.name === "AbortError") {
                        return true;
                    }
                }
            }
            await navigator.clipboard.writeText(text);
            return false;
        };
        window.openBibleCopy = function (text) {
            return navigator.clipboard.writeText(text);
        };
        window.openBibleScrollTo = function (id) {
            var el = document.getElementById(id);
            if (el) {
                el.scrollIntoView({ behavior: "smooth", block: "center" });
            }
        };
    </script>
    <script>navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });</script>
    <script src="interop/openbible-store.js"></script>
    <script src="interop/openbible-files.js"></script>
    <script>
        // iOS Web App Installation Guide
        (function () {
            const isIOS = /iphone|ipad|ipod/.test(navigator.userAgent.toLowerCase());
            const isStandalone = window.navigator.standalone === true;

            // Jika iOS dan belum di-add ke home screen
            if (isIOS && !isStandalone && !sessionStorage.getItem('dismissed-ios-prompt')) {
                setTimeout(() => {
                    const banner = document.createElement('div');
                    banner.id = 'ios-install-banner';
                    banner.innerHTML = `
                        <div style="position: fixed; bottom: 0; left: 0; right: 0; background: linear-gradient(135deg, #1e3a5f 0%, #2c5aa0 100%); color: white; padding: 14px 16px; text-align: center; font-size: 13px; z-index: 9999; display: flex; justify-content: space-between; align-items: center; gap: 12px; box-shadow: 0 -2px 8px rgba(0,0,0,0.1); font-weight: 500;">
                            <span style="flex: 1;">💡 Tap <strong>Share</strong> then <strong>Add to Home Screen</strong></span>
                            <button id="dismiss-ios-banner" style="background: white; color: #1e3a5f; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px; flex-shrink: 0;">✕</button>
                        </div>
                    `;
                    document.body.appendChild(banner);

                    document.getElementById('dismiss-ios-banner').addEventListener('click', function () {
                        document.getElementById('ios-install-banner').style.display = 'none';
                        sessionStorage.setItem('dismissed-ios-prompt', '1');
                    });
                }, 2000);
            }
        })();
    </script>
</body>

</html>
