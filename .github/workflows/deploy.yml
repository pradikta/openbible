name: Deploy

on:
  # Runs after the CI workflow completed on main.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Manual re-publish and redeploy of the current main branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  # workflow_run carries the commit CI validated, a manual run uses github.sha.
  REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}

# Runtime source registry configuration is not set here. Set OPENBIBLE_SOURCES__*
# or OPENBIBLE_SOURCES_FILE in the Portainer stack environment (or mount
# sources.json); the GitHub environment variables and secrets below are only
# deployment credentials. See the README "Deploying a source registry" section.

jobs:
  publish:
    name: Publish image to GHCR
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.event == 'push'
      && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout the validated revision
        uses: actions/checkout@v7
        with:
          ref: ${{ env.REVISION }}

      - name: Resolve the short revision and build date
        id: meta_vars
        run: |
          echo "short=${REVISION:0:7}" >> "${GITHUB_OUTPUT}"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ steps.meta_vars.outputs.short }}
          labels: |
            org.opencontainers.image.revision=${{ env.REVISION }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          # Portainer pulls the arm64 manifest; amd64 keeps the tag usable on regular Docker hosts.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            REVISION=${{ env.REVISION }}
            BUILD_DATE=${{ steps.meta_vars.outputs.date }}
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64
            type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release
          # Attestation manifests are skipped so every registry client, Portainer included, can pull the tag.
          provenance: false

  redeploy:
    name: Trigger Portainer redeploy
    needs: publish
    runs-on: ubuntu-latest
    # Secrets of the "PRD" environment are only exposed to jobs that declare it.
    environment: PRD
    steps:
      - name: Trigger the Portainer stack webhook
        id: webhook
        env:
          WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [ -z "${WEBHOOK_URL}" ]; then
            echo "triggered=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::PORTAINER_WEBHOOK_URL is not set, the webhook was not triggered"
            exit 0
          fi

          # No --location: a redirect to a Cloudflare Access login page must not look like success.
          curl_args=(
            --silent
            --show-error
            --max-time 60
            --request POST
            --output /tmp/portainer-webhook.txt
            --write-out '%{http_code}'
          )
          if [ -n "${CF_ACCESS_CLIENT_ID}" ] && [ -n "${CF_ACCESS_CLIENT_SECRET}" ]; then
            curl_args+=(
              --header "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}"
              --header "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}"
            )
          fi

          for attempt in $(seq 1 5); do
            code=$(curl "${curl_args[@]}" "${WEBHOOK_URL}" || echo 000)
            echo "webhook attempt ${attempt}: HTTP ${code}"

            case "${code}" in
              200|201|202|204)
                cat /tmp/portainer-webhook.txt || true
                echo "triggered=true" >> "${GITHUB_OUTPUT}"
                exit 0
                ;;
              301|302|303|307|308)
                echo "::warning::the webhook was redirected, check the Cloudflare Access service token"
                ;;
              403)
                echo "::warning::the webhook was forbidden, check the Cloudflare Access service token and its policy"
                ;;
            esac

            cat /tmp/portainer-webhook.txt || true
            sleep 10
          done

          echo "::error::Portainer webhook did not answer with a success status"
          exit 1

      - name: Verify the deployed revision
        if: ${{ steps.webhook.outputs.triggered == 'true' && vars.PUBLIC_URL != '' }}
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          EXPECTED_REVISION: ${{ env.REVISION }}
          POLL_SECONDS: "10"
          MAX_ATTEMPTS: "30"
        run: |
          # An HTTP 200 alone would also come from the old container, so wait for
          # /version.json to report the revision baked into the new image.
          echo "waiting for ${PUBLIC_URL} to serve revision ${EXPECTED_REVISION}"

          served=""
          for attempt in $(seq 1 "${MAX_ATTEMPTS}"); do
            code=$(curl --silent --location --max-time 30 \
              --output /tmp/version.json \
              --write-out '%{http_code}' \
              "${PUBLIC_URL}/version.json?ts=$(date +%s%N)" || echo 000)

            served=$(sed -n 's/.*"revision"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' /tmp/version.json 2>/dev/null | head -n 1)
            served="${served:-<none>}"
            echo "attempt ${attempt}: HTTP ${code}, revision ${served}"

            if [ "${served}" = "${EXPECTED_REVISION}" ]; then
              echo "${PUBLIC_URL} is serving revision ${EXPECTED_REVISION}"
              exit 0
            fi
            sleep "${POLL_SECONDS}"
          done

          echo "::error::${PUBLIC_URL} serves revision ${served} instead of ${EXPECTED_REVISION}, the container was not recreated with the new image"
          exit 1
