name: CI

# Verification only. Deploy runs after this workflow succeeds on main (see deploy.yml).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/*.trx

  compose:
    name: Validate compose file
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Validate the compose stack
        run: docker compose config --quiet

  docker-amd64:
    name: Smoke test amd64 image
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the amd64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: openbible:amd64-ci
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64
          provenance: false

      - name: Start the container
        run: docker run --detach --name openbible --publish 8080:8080 openbible:amd64-ci

      - name: Smoke test
        run: sh tools/smoke_test.sh http://localhost:8080

      - name: Dump container logs on failure
        if: failure()
        run: docker logs openbible || true

      - name: Remove container
        if: always()
        run: docker rm --force openbible || true

  # Portainer runs on ARM64, so the arm64 variant is built and started under
  # QEMU on every run instead of only being discovered broken at deploy time.
  docker-arm64:
    name: Verify the ARM64 image
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build the ARM64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: openbible:arm64-ci
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64
          provenance: false

      - name: Start the ARM64 container
        run: docker run --detach --name openbible-arm64 --platform linux/arm64 --publish 8080:8080 openbible:arm64-ci

      - name: Smoke test the ARM64 container
        run: sh tools/smoke_test.sh http://localhost:8080

      - name: Dump container logs on failure
        if: failure()
        run: docker logs openbible-arm64 || true

      - name: Remove container
        if: always()
        run: docker rm --force openbible-arm64 || true
