services:
  openbible:
    image: ghcr.io/pradikta/openbible:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${OPENBIBLE_PORT:-8080}:8080"
    # Optional: enable a deployment-configured source registry and catalog cache.
    # environment:
    #   OPENBIBLE_SOURCES_FILE: /config/sources.json
    #   OPENBIBLE_CATALOG_CACHE: /data/catalog-cache
    #   OPENBIBLE_ADMIN_TOKEN: change-me
    # volumes:
    #   - ./sources.json:/config/sources.json:ro
    #   - ./catalog-cache:/data/catalog-cache
    restart: unless-stopped
    healthcheck:
      # The runtime image ships no curl; bash's /dev/tcp is enough for a plain HTTP probe.
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET / HTTP/1.0\r\n\r\n' >&3 && head -n1 <&3 | grep -q ' 200 '
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
